
name: Build Jio TV Plus APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -q JioTVPlus_Simple_Select.zip -d source
          test -f source/Jio_TV_Plus_Android_Project/app/build.gradle

      - name: Build APK
        working-directory: source/Jio_TV_Plus_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jio-TV-Plus-debug-APK
          path: source/Jio_TV_Plus_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
