name: Build Jio TV Plus APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: findzip
        run: |
          if [ -f "JioTVPlus_Mobile_Fix_v3.zip" ]; then
            echo "zip=JioTVPlus_Mobile_Fix_v3.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "JioTVPlus_Simple_Select_CRASHFIX_v2.zip" ]; then
            echo "zip=JioTVPlus_Simple_Select_CRASHFIX_v2.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "JioTVPlus_Simple_Select_FIXED.zip" ]; then
            echo "zip=JioTVPlus_Simple_Select_FIXED.zip" >> "$GITHUB_OUTPUT"
          else
            echo "No supported project ZIP found"
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir app-source
          unzip -q "${{ steps.findzip.outputs.zip }}" -d app-source
          find app-source -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd app-source
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found in ZIP"
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jio-TV-Plus-debug-APK
          path: app-source/**/build/outputs/apk/debug/*.apk
